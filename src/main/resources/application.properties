spring.application.name=ExpenseTrackerBackend



# H2 console url
#http://localhost:8080/h2-console/

spring.datasource.url = jdbc:h2:mem:expensetrackerdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = password

spring.jpa.database-platform = org.hibernate.dialect.H2Dialect
spring.h2.console.enabled = true

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# depending on your needs
# you can create the database every time the app starts (create)
# or keep it (update)
spring.jpa.hibernate.ddl-auto = create
#spring.jpa.hibernate.ddl-auto = update


